# Gate for every PR and push to main. Dependabot auto-merge waits on these jobs,
# so they are the only thing standing between an automated bump and main.
#
# Deliberately single-version: the newest Node and the newest Python, no matrix.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"
  PYTHON_VERSION: "3.14"

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3

      - name: Install package
        working-directory: python
        # A managed interpreter in a venv, not --system: setup-uv provisions uv
        # but leaves no system Python for the requested version, so
        # `uv pip install --system` fails with "No system Python installation
        # found for Python 3.14".
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -e ".[dev]"

      - name: Test
        working-directory: python
        run: uv run pytest
