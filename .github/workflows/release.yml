# Publishes the Python package in python/ to PyPI using Trusted Publishing.
#
# No API token is stored anywhere: the `id-token: write` permission lets the job
# mint a short-lived OIDC credential that PyPI exchanges for an upload token.
#
# The filename must stay release.yml: PyPI matches the Trusted Publisher on the
# workflow's filename, and the registered publisher names release.yml. Renaming
# this file breaks the credential exchange.
name: Publish Python package to PyPI

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3

      - name: Run tests
        working-directory: python
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest

      - name: Build sdist and wheel
        working-directory: python
        run: uv build

      - name: Verify distribution metadata
        working-directory: python
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: python/dist/
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment gates the release and is matched by the Trusted Publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/chaos-atlas
    permissions:
      id-token: write # mints the OIDC token; no PyPI secret required
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
