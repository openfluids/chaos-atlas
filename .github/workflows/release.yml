# Publishes the Python package in python/ to PyPI using Trusted Publishing.
#
# No API token is stored anywhere: the `id-token: write` permission lets the job
# mint a short-lived OIDC credential that PyPI exchanges for an upload token.
#
# The filename must stay release.yml: PyPI matches the Trusted Publisher on the
# workflow's filename, and the registered publisher names release.yml. Renaming
# this file breaks the credential exchange.
name: Publish Python package to PyPI

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run tests
        working-directory: python
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest

      - name: Build sdist and wheel
        working-directory: python
        run: uv build

      - name: Verify distribution metadata
        working-directory: python
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: python/dist/
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment gates the release and is matched by the Trusted Publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/chaos-atlas
    permissions:
      id-token: write # mints the OIDC token; no PyPI secret required
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
