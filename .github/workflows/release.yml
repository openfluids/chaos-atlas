# Publishes the Python package in python/ to PyPI using Trusted Publishing.
#
# No API token is stored anywhere: the `id-token: write` permission lets the job
# mint a short-lived OIDC credential that PyPI exchanges for an upload token.
#
# The filename must stay release.yml: PyPI matches the Trusted Publisher on the
# workflow's filename, and the registered publisher names release.yml. Renaming
# this file breaks the credential exchange.
name: Publish Python package to PyPI

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run tests
        working-directory: python
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest

      - name: Build sdist and wheel
        working-directory: python
        run: uv build

      - name: Verify distribution metadata
        working-directory: python
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: python/dist/
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment gates the release and is matched by the Trusted Publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/chaos-atlas
    permissions:
      id-token: write # mints the OIDC token; no PyPI secret required
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
