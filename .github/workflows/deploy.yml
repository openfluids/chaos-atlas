# GitHub Actions workflow for building and deploying a Next.js site to GitHub Pages
# Builds on the same Node version CI tests against, so the deployed artifact
# is the one that was verified.
name: Deploy Next.js to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Runs on pull requests targeting the default branch for preview
  pull_request:
    branches: ["main"]

# Least privilege by default. pages:write and id-token:write are granted only to
# the deploy job below, so the build job — which runs npm ci and therefore
# executes dependency code — cannot reach the Pages deployment credential.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch full history for better caching

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install --frozen-lockfile" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            echo "lockfile=yarn.lock" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
            echo "command=install --frozen-lockfile" >> $GITHUB_OUTPUT
            echo "runner=pnpm" >> $GITHUB_OUTPUT
            echo "lockfile=pnpm-lock.yaml" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            echo "lockfile=package-lock.json" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26" # matches the version CI tests against
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Automatically inject basePath in your Next.js configuration file and disable
          # server side image optimization for static hosting
          static_site_generator: next

      - name: Restore build cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .next/cache
            .next/server
            .next/static
          # Generate a more specific cache key for better hit rates
          key: ${{ runner.os }}-nextjs-v26-${{ hashFiles('**/package.json', '**/${{ steps.detect-package-manager.outputs.lockfile }}', '**/next.config.js') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx', '**/*.[cm]js', '**/*.json') }}
          # Fallback caches for different scenarios
          restore-keys: |
            ${{ runner.os }}-nextjs-v26-${{ hashFiles('**/package.json', '**/${{ steps.detect-package-manager.outputs.lockfile }}') }}-
            ${{ runner.os }}-nextjs-v26-

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
        env:
          NEXT_TELEMETRY_DISABLED: 1 # Disable telemetry for faster builds
          NODE_ENV: production

      # Note: Static export happens automatically with output: 'export' in next.config.js

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./out
          retention-days: 1 # Keep artifact for only 1 day to save space

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    # Scoped here rather than at the top of the file: only this job deploys.
    permissions:
      pages: write
      id-token: write
    if: github.ref == 'refs/heads/main' # Only deploy on main branch pushes
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          timeout: 300000 # 5 minutes timeout for deployment