name: React Doctor

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan changed React files
        if: github.event_name == 'pull_request'
        uses: millionco/react-doctor@5dc936e111fda0d77bc7a8a36ece3b1ec6b9bf27
        with:
          diff: main
          github-token: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.GITHUB_TOKEN || '' }}
          fail-on: none
          offline: true
          verbose: false

      - name: Scan React project
        if: github.event_name != 'pull_request'
        uses: millionco/react-doctor@5dc936e111fda0d77bc7a8a36ece3b1ec6b9bf27
        with:
          fail-on: none
          offline: true
          verbose: false
