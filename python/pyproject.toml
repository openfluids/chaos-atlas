[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaos-atlas"
version = "0.1.0"
description = "Iterated maps, coupled map lattices, and Lyapunov exponents for chaotic dynamical systems"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ricardo A S Frantz", email = "rasfrantz@gmail.com" }]
keywords = [
    "chaos-theory",
    "dynamical-systems",
    "strange-attractors",
    "bifurcation-diagrams",
    "coupled-map-lattices",
    "lyapunov-exponents",
    "fractal-geometry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://openfluids.github.io/chaos-atlas/"
Repository = "https://github.com/openfluids/chaos-atlas"
Issues = "https://github.com/openfluids/chaos-atlas/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/chaos_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
